<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AGTA - Brain Identity</title>
    <link rel="icon" type="image/svg+xml" href="/agta-icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://agta.io/apple-icon.png?a853424402caf5fe" />
    <script>
      // Set theme before render to avoid flash (default: dark)
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('mavra-theme') || 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
